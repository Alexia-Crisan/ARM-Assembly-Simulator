<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ARM Assembly Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="editor">
      <h2>Assembly Code</h2>

      <div id="editor-wrapper">
        <div id="line-numbers">1</div>
        <textarea id="codeArea" spellcheck="false">
          ; Gauss sum  1..6 = 21
          MOV R0, #6
          MOV R1, #0      ; sum = 0
          MOV R2, #1      ; counter = 1
          ADD R0, R0, #1
          sum_loop:
          ADD R1, R1, R2  ; sum += counter
          ADD R2, #1
          CMP R2, R0
          BNE sum_loop
          HLT</textarea
        >
      </div>

      <div id="btn-bar">
        <button class="btn-primary" onclick="assembleAndRun()">
          &#9654; Assemble &amp; Run
        </button>
        <button class="btn-secondary" onclick="resetProgram()">
          &#8634; Reset
        </button>
        <button class="btn-debug" onclick="startDebug()">&#9650; Debug</button>
        <button class="btn-macros" onclick="toggleMacros()">
          &#8853; Macros
        </button>
        <button class="btn-docs" onclick="goToDocs()">
          &#8862; Instructions
        </button>
      </div>

      <div id="debug-bar" class="hidden">
        <button class="btn-step" onclick="stepDebug()">Step &#8594;</button>
        <button class="btn-run" onclick="runDebug()">Run &#187;</button>
        <button class="btn-stop" onclick="stopDebug()">&#10005; Stop</button>
        <span id="debug-status"></span>
      </div>
    </div>

    <div id="macros-panel" class="hidden">
      <div id="macros-header">
        <h2>User Macros</h2>
        <span id="macros-hint"
          >Define custom pseudo-instructions. Use parameter names (e.g. Rd, Rn)
          in the body.</span
        >
      </div>

      <div id="macros-table-wrap">
        <table id="macros-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Parameters <span class="th-hint">(comma-separated)</span></th>
              <th>
                Body <span class="th-hint">(one instruction per line)</span>
              </th>
              <th></th>
            </tr>
          </thead>
          <tbody id="macros-body"></tbody>
        </table>
      </div>

      <button class="btn-macro-add" onclick="addMacroRow()">+ Add Macro</button>
    </div>

    <div id="output">
      <h2>Visualization</h2>
      <div id="results">
        <p style="color: #555; font-size: 13px">
          Run a program to see results here.
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
